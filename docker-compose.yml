# ============================================================
# docker-compose.yml — IDSS Pipeline (dev mode)
# Chạy: docker-compose up
# ============================================================
version: "3.9"

services:
  pipeline:
    build: .
    container_name: idss-pipeline
    volumes:
      # Mount data + logs ra ngoài để persist qua lần chạy
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      # Thêm ANTHROPIC_API_KEY nếu muốn dùng Claude API
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    command: python main_pipeline.py

